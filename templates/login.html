<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Aura</title><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="/">au<span class="brand-mark">ra</span></a><h1>Welcome back</h1><p class="auth-subtitle">Take a quiet moment for yourself.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>Email address</label><input type="email" name="email" autocomplete="email" required autofocus></div><div class="field"><label for="password">Password</label><div class="password-field"><input id="password" type="password" name="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password="password" aria-label="Show password"><i class="bx bx-show"></i></button></div></div><p class="auth-switch"><a href="/forgot-password">Forgot password?</a></p><button class="button" type="submit">Sign in</button></form><p class="auth-switch">New to Aura? <a href="/register">Create an account</a></p><p class="form-message" id="form-message"></p></main><script>const p=new URLSearchParams(location.search),m=document.getElementById('form-message');if(p.get('error'))m.textContent='We could not match those details. Please try again.';if(p.get('registered'))m.textContent='Your account is ready. Please check your email to confirm it, then sign in.';document.querySelectorAll('.password-toggle').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.password),show=i.type==='password';i.type=show?'text':'password';b.setAttribute('aria-label',show?'Hide password':'Show password');b.innerHTML=`<i class="bx ${show?'bx-hide':'bx-show'}"></i>`});</script></body></html>
