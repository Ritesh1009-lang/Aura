<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Aura</title><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="/">au<span class="brand-mark">ra</span></a><h1>Create your space</h1><p class="auth-subtitle">Your reflections are saved only after you sign in.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>Username</label><input name="username" minlength="3" required></div><div class="field"><label>Email address</label><input type="email" name="email" required></div><div class="field"><label>Phone country</label><select name="phone_country" required><option value="">Select country code</option><option value="IN +91">India +91</option><option value="US +1">United States +1</option><option value="GB +44">United Kingdom +44</option><option value="AU +61">Australia +61</option></select></div><div class="field"><label>Phone number</label><input type="tel" name="phone_number" required></div><div class="field"><label>Date of birth</label><input type="date" name="dob" required></div><div class="field"><label>Age</label><input type="number" name="age" min="13" max="130" required></div><div class="field"><label for="password">Password</label><div class="password-field"><input id="password" type="password" name="password" minlength="8" required><button class="password-toggle" type="button" data-password="password" aria-label="Show password"><i class="bx bx-show"></i></button></div></div><div class="field"><label for="confirm-password">Confirm password</label><div class="password-field"><input id="confirm-password" type="password" name="confirm_password" minlength="8" required><button class="password-toggle" type="button" data-password="confirm-password" aria-label="Show password"><i class="bx bx-show"></i></button></div></div><button class="button" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p><p class="form-message" id="form-message"></p></main><script>const e=new URLSearchParams(location.search).get('error'),m=document.getElementById('form-message');if(e)m.textContent=e==='exists'?'That email is already registered.':'There was a problem reaching Supabase. Verify your .env values, restart the server, and try again.';document.querySelectorAll('.password-toggle').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.password),show=i.type==='password';i.type=show?'text':'password';b.setAttribute('aria-label',show?'Hide password':'Show password');b.innerHTML=`<i class="bx ${show?'bx-hide':'bx-show'}"></i>`});</script></body></html>
