<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password | Aura</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="/">au<span class="brand-mark">ra</span></a><h1>Choose a new password</h1><p class="auth-subtitle">Use at least 8 characters and keep it unique to Aura.</p><form id="reset-form"><div class="field"><label>New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm new password</label><input id="confirm-password" type="password" minlength="8" required autocomplete="new-password"></div><button class="button" type="submit">Save new password</button></form><p class="form-message" id="message" aria-live="polite"></p></main><script>const csrf='{{ csrf_token() }}',form=document.getElementById('reset-form'),message=document.getElementById('message'),params=new URLSearchParams(location.hash.slice(1));form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm-password').value;if(password!==confirm){message.textContent='Passwords do not match.';return}const response=await fetch('/reset-password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({password,access_token:params.get('access_token'),refresh_token:params.get('refresh_token')})});const data=await response.json();if(data.ok){message.style.color='#276356';message.textContent='Password updated. Redirecting to sign in…';setTimeout(()=>location.href='/login',1200)}else message.textContent=data.error||'Unable to reset the password.'});</script></body></html>
